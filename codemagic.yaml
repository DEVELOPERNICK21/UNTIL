workflows:
  android-workflow:
    name: UNTIL Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    environment:
      groups:
        - google_play # Must contain secret GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        - until_release # REVENUECAT_API_KEY_IOS, REVENUECAT_API_KEY_ANDROID, UNTIL_POSTHOG_API_KEY (secrets)
      android_signing:
        # Must match Codemagic UI → Code signing identities → Android keystores reference name
        - UNTILAPP
      vars:
        PACKAGE_NAME: 'app.until.time'
        # Firebase Web OAuth client (client_type 3). Required for Google Sign-In in release bundles.
        UNTIL_GOOGLE_WEB_CLIENT_ID: '150745476537-l5sr6mf0ma7le6qqgk88387fmhgc6p3a.apps.googleusercontent.com'

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install npm dependencies
        script: |
          npm install
      - name: Write release env for Babel inline
        script: |
          # .env is gitignored; Babel inlines UNTIL_* / REVENUECAT_* at bundle time.
          {
            echo "UNTIL_GOOGLE_WEB_CLIENT_ID=${UNTIL_GOOGLE_WEB_CLIENT_ID}"
            echo "UNTIL_POSTHOG_API_KEY=${UNTIL_POSTHOG_API_KEY:-}"
            echo "UNTIL_POSTHOG_HOST=${UNTIL_POSTHOG_HOST:-https://us.i.posthog.com}"
            echo "REVENUECAT_API_KEY_IOS=${REVENUECAT_API_KEY_IOS:-}"
            echo "REVENUECAT_API_KEY_ANDROID=${REVENUECAT_API_KEY_ANDROID:-}"
          } > "$CM_BUILD_DIR/.env"
          if [ -z "$UNTIL_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "ERROR: UNTIL_GOOGLE_WEB_CLIENT_ID is empty" >&2
            exit 1
          fi
          if [ -z "$REVENUECAT_API_KEY_ANDROID" ]; then
            echo "ERROR: REVENUECAT_API_KEY_ANDROID is empty (use goog_ key, never test_)" >&2
            exit 1
          fi
          case "$REVENUECAT_API_KEY_ANDROID" in
            test_*)
              echo "ERROR: REVENUECAT_API_KEY_ANDROID must not be a Test Store test_ key in release" >&2
              exit 1
              ;;
          esac
          echo "Wrote .env with Google Web Client ID + RevenueCat keys"
      - name: Build Android release AAB
        script: |
          set -e
          LATEST="$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials "@env:GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)"
          if [ -z "$LATEST" ] || ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            # Fallback above last known Play codes (phone 16, wear 19)
            UPDATED_BUILD_NUMBER=20
          else
            UPDATED_BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "Using versionCode=$UPDATED_BUILD_NUMBER (Play latest was '${LATEST:-none}')"
          # Ensure Gradle/Babel child processes see the client id even without .env
          export UNTIL_GOOGLE_WEB_CLIENT_ID
          cd android
          ./gradlew bundleRelease -PuntilVersionCode="$UPDATED_BUILD_NUMBER"

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - developernick1@gmail.com # Replace with your email
        notify:
          success: true
          failure: true
      # Uncomment and set up for Play Store:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

# track value	Where it goes
# internal
# Internal testing (what you have now)
# alpha / closed
# Closed testing
# beta / open
# Open testing
# production
# Production (live store)

  ios-workflow:
    name: UNTIL iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    environment:
      groups:
        - until_release # REVENUECAT_API_KEY_IOS, REVENUECAT_API_KEY_ANDROID, UNTIL_POSTHOG_API_KEY (secrets)
      ios_signing:
        distribution_type: app_store # or ad_hoc for TestFlight/internal
        bundle_identifier: com.developernick.until
      vars:
        BUNDLE_ID: 'com.developernick.until'
        XCODE_WORKSPACE: 'UNTIL.xcworkspace'
        XCODE_SCHEME: 'UNTIL'
        # Same Firebase Web OAuth client as Android. Without it Google Sign-In fails in release.
        UNTIL_GOOGLE_WEB_CLIENT_ID: '150745476537-l5sr6mf0ma7le6qqgk88387fmhgc6p3a.apps.googleusercontent.com'

    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Write release env for Babel inline
        script: |
          # .env is gitignored; Babel inlines REVENUECAT_* at bundle time.
          # test_ keys crash release (RevenueCat checkForSimulatedStoreAPIKeyInRelease).
          {
            echo "UNTIL_POSTHOG_API_KEY=${UNTIL_POSTHOG_API_KEY:-}"
            echo "UNTIL_POSTHOG_HOST=${UNTIL_POSTHOG_HOST:-https://us.i.posthog.com}"
            echo "UNTIL_GOOGLE_WEB_CLIENT_ID=${UNTIL_GOOGLE_WEB_CLIENT_ID:-}"
            echo "REVENUECAT_API_KEY_IOS=${REVENUECAT_API_KEY_IOS:-}"
            echo "REVENUECAT_API_KEY_ANDROID=${REVENUECAT_API_KEY_ANDROID:-}"
          } > "$CM_BUILD_DIR/.env"
          if [ -z "$UNTIL_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "ERROR: UNTIL_GOOGLE_WEB_CLIENT_ID is empty" >&2
            exit 1
          fi
          if [ -z "$REVENUECAT_API_KEY_IOS" ]; then
            echo "ERROR: REVENUECAT_API_KEY_IOS is empty (use appl_ key, never test_)" >&2
            exit 1
          fi
          case "$REVENUECAT_API_KEY_IOS" in
            test_*)
              echo "ERROR: REVENUECAT_API_KEY_IOS must not be a Test Store test_ key in release" >&2
              exit 1
              ;;
            appl_*) ;;
            *)
              echo "WARNING: REVENUECAT_API_KEY_IOS does not start with appl_" >&2
              ;;
          esac
          echo "Wrote .env with RevenueCat iOS key"
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - developernick1@gmail.com # Replace with your email
        notify:
          success: true
          failure: true
      # Uncomment when App Store Connect API key is added (integrations + app_store_connect):
      # app_store_connect:
      #     auth: integration
      #     submit_to_testflight: true
