# CodeQL code scanning.
#
# Languages and why:
#   actions, javascript-typescript, ruby, rust  analysed from source, no build needed.
#   java-kotlin   the Android widgets and native modules. Needs `npm ci` first: the Gradle build loads the
#                 React Native plugin from node_modules, and without it Gradle stops before compiling.
#   swift         the iOS app, widgets and watch app. Its own job below: it is a full Xcode build of the
#                 React Native app under the CodeQL tracer, which takes well over half an hour, so it runs
#                 on pushes to main and on the weekly schedule, not on every pull request.
# c-cpp is not scanned: the repository has no C or C++ source of its own (only two Objective-C bridge
# files), and CodeQL fails a c-cpp job that finds nothing to extract.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 8 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: ruby
          build-mode: none
        - language: rust
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # The Android build reads node_modules (the React Native Gradle plugin lives there).
    - name: Set up Node
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install JavaScript dependencies
      if: matrix.language == 'java-kotlin'
      shell: bash
      # --ignore-scripts: nothing here needs a lifecycle script, and it keeps third-party install scripts out of CI.
      run: npm ci --ignore-scripts

    - name: Set up JDK 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # CodeQL traces the compiler, so this compiles the Kotlin and Java sources and nothing else: no
    # native code, no JS bundle, no signing. The daemon and the build cache are off so every
    # compile really runs under the tracer.
    - name: Compile the Android sources
      if: matrix.language == 'java-kotlin'
      shell: bash
      working-directory: android
      run: |
        chmod +x ./gradlew
        ./gradlew --no-daemon --no-build-cache \
          :app:compileDebugKotlin :app:compileDebugJavaWithJavac

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  analyze-swift:
    name: Analyze (swift)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install JavaScript dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: swift
        build-mode: manual

    # Swift is built explicitly. With node_modules installed, CodeQL's autobuild finds every Xcode project
    # inside it too, fails to read one ("Cannot parse a NULL or zero-length data") and gives up. Building
    # the app scheme builds the app, the widgets and the watch app, which is all the Swift in the repo.
    - name: Build the iOS app
      shell: bash
      working-directory: ios
      run: |
        pod install
        xcodebuild clean build \
          -workspace UNTIL.xcworkspace -scheme UNTIL \
          -configuration Debug -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:swift"
