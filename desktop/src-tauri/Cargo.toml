[package]
name = "until-desktop"
version = "0.1.0"
description = "UNTIL desktop companion"
authors = ["UNTIL"]
edition = "2021"

[lib]
name = "until_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
